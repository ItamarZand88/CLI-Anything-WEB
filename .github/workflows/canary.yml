name: Fleet Canary

# Scheduled live-site smoke: runs each registry-declared read-only canary
# command against the real target sites and opens/updates an issue when a
# CLI breaks (site redesign, new anti-bot protection, API move).

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install devkit and canary CLIs
        run: |
          pip install -e devkit
          python - <<'EOF'
          import json
          import subprocess

          reg = json.load(open("registry.json"))
          for cli in reg["clis"]:
              if cli.get("canary"):
                  subprocess.run(
                      ["pip", "install", "-q", "-e", cli["directory"]], check=True
                  )
          EOF

      # Unsplash and FUTBIN use Camoufox to clear browser challenges.
      # Installing the Python package does not install its browser payload, so
      # an uncached canary otherwise emits download progress and exits before
      # it can return JSON.
      - name: Restore Camoufox browser
        id: camoufox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('unsplash/agent-harness/setup.py', 'futbin/agent-harness/setup.py') }}

      - name: Install Camoufox browser
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: python -m camoufox fetch

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gai/agent-harness/setup.py') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Run canaries
        id: canary
        run: |
          set +e
          cli-web-devkit canary --json > canary-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat canary-report.json

      - name: Open or update breakage issue
        if: steps.canary.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('canary-report.json', 'utf8'));
            // Only "broken" failures are actionable. "blocked" results (the
            // target bot-blocked/rate-limited the CI runner's IP) work fine for
            // real users and would otherwise reopen this issue every single day.
            const failures = report.results.filter(r => r.status === 'broken');
            const blocked = report.results.filter(r => r.status === 'blocked');
            const byCli = {};
            for (const f of failures) (byCli[f.cli] ??= []).push(f);

            const title = `Fleet canary: ${Object.keys(byCli).length} CLI(s) failing against live sites`;
            const lines = [
              'The scheduled fleet canary detected live-site breakage in a CLI’s own logic/parsing.',
              '',
              ...Object.entries(byCli).flatMap(([cli, fails]) => [
                `### ${cli}`,
                ...fails.map(f => `- \`${f.argv.join(' ')}\` — ${f.detail}`),
                '',
              ]),
              '_Likely causes: site redesign or API change._',
              '_Next step: run `/refine` on the affected CLI (see cli-anything-web-plugin)._',
            ];
            if (blocked.length) {
              lines.push(
                '',
                `_Also ${blocked.length} CLI command(s) were anti-bot/rate-limit blocked from the CI runner IP — not listed here, as they work for real users and are not /refine-able._`,
              );
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-breakage',
            });
            const body = lines.join('\n');
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['site-breakage'],
              });
            }

      - name: Close recovered breakage issue
        if: steps.canary.outputs.exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-breakage',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All actionable fleet canaries recovered. Closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail job on canary failures
        if: steps.canary.outputs.exit_code != '0'
        run: exit 1
