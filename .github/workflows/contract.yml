name: Fleet Contract

# Offline contract tests for every CLI in registry.json: entry point,
# --help/--version, REPL default + clean exit, no protocol leaks, registry
# commands present in --help. Plus vendored-file drift detection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install devkit, core, and the whole fleet
        run: |
          pip install -e devkit -e cli-web-core pytest
          for dir in */agent-harness; do pip install -q -e "$dir"; done

      - name: Vendored shared-file drift check
        run: cli-web-devkit drift

      - name: Strict fleet checklist
        run: |
          python - <<'PY'
          import json
          import subprocess

          for cli in json.load(open("registry.json"))["clis"]:
              subprocess.run(
                  [
                      "python",
                      "cli-anything-web-plugin/scripts/validate-checklist.py",
                      cli["directory"],
                      "--app-name",
                      cli["name"].removeprefix("cli-web-"),
                      "--strict",
                  ],
                  check=True,
              )
          PY

      - name: Fleet contract suite
        env:
          CLI_WEB_FORCE_INSTALLED: "1"
        run: python -m pytest tests/contract -q
