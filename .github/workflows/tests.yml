name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow release-please workflow to trigger tests
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  lint:
    name: lint & registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Validate registry.json against fleet
        run: python devkit/cli_web_devkit/registry_check.py
      - name: README fleet sections freshness
        run: PYTHONPATH=devkit python -m cli_web_devkit docs --check
      - name: About description CLI count freshness
        # Read-only: compares the GitHub "About" count to registry.json. The
        # default token can read repo metadata but not write it, so a stale
        # count is reported here and fixed with `cli-web-devkit about --apply`
        # (a maintainer step). No-ops if gh metadata is unavailable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=devkit python -m cli_web_devkit about --check

  plugin:
    name: plugin & devkit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test tooling
        # jinja2: required by scaffold-cli.py (template engine) — the golden
        # tests scaffold every profile combination. click: required by the
        # cli-web-core mcp_server/doctor test suites.
        run: pip install pytest pytest-cov mypy jinja2 click
      - name: Plugin script, devkit & core tests (with coverage)
        run: |
          python -m pytest cli-anything-web-plugin/scripts/tests devkit/tests \
            cli-web-core/tests --cov --cov-report=term-missing
      - name: Mypy (devkit & core packages)
        run: mypy

  matrix:
    name: build test matrix
    runs-on: ubuntu-latest
    outputs:
      clis: ${{ steps.set.outputs.clis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate matrix from registry.json
        id: set
        run: |
          echo "clis=$(PYTHONPATH=devkit python -m cli_web_devkit matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.cli.name }} (py${{ matrix.python }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        cli: ${{ fromJSON(needs.matrix.outputs.clis) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CLI package
        run: pip install -e ${{ matrix.cli.dir }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest ${{ matrix.cli.dir }}/cli_web/${{ matrix.cli.pkg }}/tests/test_core.py -v
      - name: Run offline subprocess E2E tests
        if: matrix.python == '3.12'
        env:
          CLI_WEB_FORCE_INSTALLED: "1"
        run: |
          test_file="${{ matrix.cli.dir }}/cli_web/${{ matrix.cli.pkg }}/tests/test_e2e.py"
          if [ -f "$test_file" ]; then
            smoke_tests="$(
              python - "$test_file" <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          smoke_names = {
              "test_help",
              "test_help_loads",
              "test_help_output",
              "test_cli_help",
              "test_version",
              "test_cli_version",
              "test_version_works",
          }
          for node in ast.parse(path.read_text(encoding="utf-8")).body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  if node.name in smoke_names:
                      print(f"{path}::{node.name}")
              elif isinstance(node, ast.ClassDef):
                  for function in node.body:
                      if (
                          isinstance(function, (ast.FunctionDef, ast.AsyncFunctionDef))
                          and function.name in smoke_names
                      ):
                          print(f"{path}::{node.name}::{function.name}")
          PY
            )"
            if [ -z "$smoke_tests" ]; then
              echo "No exact help/version subprocess tests found in $test_file" >&2
              exit 1
            fi
            # Node IDs cannot contain spaces in this fleet, so intentional
            # word splitting passes each collected smoke test separately.
            python -m pytest -o addopts= $smoke_tests -v
          fi
